services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: foru-backend
    restart: always
    environment:
      - PORT=5000
    networks:
      - foru-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: foru-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - foru-net

networks:
  foru-net:
    driver: bridge
